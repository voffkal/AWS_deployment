version: 2

defaults: &defaults
  docker:
    - image: cimg/python:3.11.1
  working_directory: ~/project

prepare_venv: &prepare_venv
  run:
    name: Create venv
    command: |
      python -m venv venv
      source venv/bin/activate
      pip install --upgrade pip

install_gh: &install_gh
  run:
    name: Install GitHub CLI
    command: |
      # cimg/python does not ship gh, and every job that touches a model
      # release needs it.
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
        | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
      sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
        | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
      sudo apt-get update -qq
      sudo apt-get install -y gh
      gh --version

fetch_model_package: &fetch_model_package
  run:
    name: Install model package from its GitHub Release
    command: |
      . venv/bin/activate
      TAG=$(gh release list --json tagName -q '[.[].tagName | select(startswith("model-v"))][0]')
      [ -n "$TAG" ] || { echo "no model-v* release published yet"; exit 1; }
      echo "Using model release $TAG"
      gh release download "$TAG" -D model_pkg -p '*.whl' --clobber
      pip install model_pkg/*.whl

fetch_data: &fetch_data
  run:
    name: Set script permissions and fetch data
    command: |
      source venv/bin/activate
      chmod +x ./scripts/fetch_kaggle_dataset.sh
      ./scripts/fetch_kaggle_dataset.sh

jobs:

  test_regression_model:
    <<: *defaults
    steps:
      - checkout
      - *prepare_venv
      - run:
          name: Install requirements
          command: |
            . venv/bin/activate
            pip install -r packages/regression_model/requirements.txt
      - *fetch_data
      - run:
          name: Train model
          command: |
            . venv/bin/activate
            PYTHONPATH=./packages/regression_model python3 packages/regression_model/regression_model/train_pipeline.py
      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            py.test -vv packages/regression_model/tests

  test_ml_api:
    <<: *defaults
    steps:
      - checkout
      - *install_gh
      - restore_cache:
          keys:
            - py-deps-{{ checksum "packages/ml_api/requirements.txt" }}
      - run:
          name: Running tests
          command: |
            #virtualenv venv
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r packages/ml_api/requirements.txt
            TAG=$(gh release list --json tagName -q '[.[].tagName | select(startswith("model-v"))][0]')
            [ -n "$TAG" ] || { echo "no model-v* release published yet"; exit 1; }
            gh release download "$TAG" -D model_pkg -p '*.whl' --clobber
            pip install model_pkg/*.whl
            py.test -vv packages/ml_api/tests -m "not differential"
      - save_cache:
          key: py-deps-{{ checksum "packages/ml_api/requirements.txt" }}
          paths:
            - "venv"


  train_and_upload_regression_model:
    <<: *defaults
    steps:
      - checkout
      - *install_gh
      - *prepare_venv
      - run:
          name: Install requirements
          command: |
            . venv/bin/activate
            pip install -r packages/regression_model/requirements.txt
      - *fetch_data
      - run:
          name: Train model
          command: |
            . venv/bin/activate
            PYTHONPATH=./packages/regression_model python3 packages/regression_model/regression_model/train_pipeline.py
      - run:
          name: Publish model package as a GitHub Release
          command: |
            . venv/bin/activate
            pip install build
            chmod +x ./scripts/publish_model.sh
            ./scripts/publish_model.sh ./packages/regression_model/

  differential_tests:
    <<: *defaults
    steps:
      - checkout
      - *install_gh
      - *prepare_venv
      # The kaggle CLI ships with the model package requirements, so those
      # have to be installed before the dataset can be fetched.
      - run:
          name: Install model requirements (brings the kaggle CLI)
          command: |
            . venv/bin/activate
            pip install -r packages/regression_model/requirements.txt
      - *fetch_data
      # Baseline: the model that is currently released. Its predictions are
      # captured BEFORE the candidate is trained, so the comparison is
      # released-model vs candidate rather than a model against itself.
      - run:
          name: Capturing predictions from the released model
          command: |
            . venv/bin/activate
            pip install -r packages/ml_api/diff_test_requirements.txt
            TAG=$(gh release list --json tagName -q '[.[].tagName | select(startswith("model-v"))][0]')
            [ -n "$TAG" ] || { echo "no model-v* release published yet"; exit 1; }
            echo "Baseline model release: $TAG"
            gh release download "$TAG" -D baseline_pkg -p '*.whl' --clobber
            pip install baseline_pkg/*.whl
            PYTHONPATH=./packages/ml_api python3 packages/ml_api/tests/capture_model_predictions.py
      # Candidate: train from this commit, replacing the released package.
      - run:
          name: Training the candidate model
          command: |
            . venv/bin/activate
            PYTHONPATH=./packages/regression_model python3 packages/regression_model/regression_model/train_pipeline.py
            pip install ./packages/regression_model
      - run:
          name: Running differential tests
          command: |
            . venv/bin/activate
            pip install -r packages/ml_api/requirements.txt
            py.test -vv packages/ml_api/tests -m differential


  publish_docker_image_to_aws:
    <<: *defaults
    # Makefile and Dockerfile live at the repo root; the old value pointed at
    # packages/ml_models, which does not exist.
    working_directory: ~/project
    steps:
      - checkout
      - setup_remote_docker
      # `make fetch-model` pulls the model wheel from its release.
      - *install_gh
      - run:
          name: Publishing docker image to aws ECR
          command: |
            pip install awscli
            # AWS_DEFAULT_REGION is the variable the AWS CLI itself reads, so
            # fall back to it rather than requiring a second copy of the region.
            AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"
            [ -n "$AWS_REGION" ] || { echo "neither AWS_REGION nor AWS_DEFAULT_REGION is set"; exit 1; }
            export AWS_REGION
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            make build-ml-api-aws tag-ml-api push-ml-api-aws
            aws ecs update-service --cluster vve-ml-api-cluster --service vve-ml-api-task-service --task-definition vve-ml-api-task --force-new-deployment


workflows:
  version: 2
  test-all:
    jobs:
      - test_regression_model
      - test_ml_api
      # differential_tests was defined but never listed here, so it never ran.
      - differential_tests
      - train_and_upload_regression_model:
          requires:
            - test_regression_model
            - test_ml_api
            - differential_tests
      - publish_docker_image_to_aws:
          requires:
            - train_and_upload_regression_model
          filters:
            branches:
              only:
                - main